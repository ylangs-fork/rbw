name: desktop-packages

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit SHA (must equal the selected workflow ref's commit)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  build-install-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require exact source and provenance identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'Select a workflow ref whose tip is exactly source_commit; provenance must identify the built source.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Build actual Debian package from committed snapshot
        run: bash packaging/desktop/build.sh "$SOURCE_COMMIT" "$RUNNER_TEMP/desktop-packages-out"
      - name: Install and probe clean Ubuntu 22.04 and 24.04
        shell: bash
        run: |
          set -euo pipefail
          context=$(mktemp -d "$RUNNER_TEMP/rbwbio-install.XXXXXXXX")
          trap 'rm -rf -- "$context"' EXIT
          cp "$RUNNER_TEMP/desktop-packages-out/"*.deb "$context/"
          cp packaging/desktop/smoke.py "$context/"
          for target in \
            '22.04@sha256:45e9ddc6895604674618a409ca9f73d301da8fdb75fe330e8e9a27b3b219e4ad' \
            '24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec'; do
            version=${target%%@*}
            docker buildx build --platform linux/amd64 --progress=plain --load \
              --file packaging/desktop/Dockerfile.smoke \
              --build-arg "UBUNTU_IMAGE=ubuntu:$target" \
              --tag "rbwbio-package-smoke:$version" "$context"
            docker run --rm --network none --cap-drop ALL \
              --security-opt no-new-privileges "rbwbio-package-smoke:$version"
          done
      - name: Collect checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/desktop-packages-out"
          sha256sum --check ./*.sha256
          sha256sum ./*.deb ./*.tar.gz artifact.json >SHA256SUMS
      - name: Attest package and source provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/desktop-packages-out/SHA256SUMS
      - name: Publish complete content-pinned release
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-packages-out"
          cp "$PROVENANCE_BUNDLE" "$out/provenance.sigstore.json"
          # Creating the ref fails if it already exists: never move a tag or
          # replace an earlier release, even on a workflow rerun.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT" >/dev/null
          gh release create "$RELEASE_TAG" "$out/"* --verify-tag --draft --latest=false \
            --title "rbwBio Linux desktop ($SOURCE_COMMIT)" \
            --notes "Built only from source commit $SOURCE_COMMIT in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Ubuntu 22.04/glibc 2.35 amd64 package with unchanged published face runtime 1.17.0; no person's enrolled model. Installed on clean Ubuntu 22.04 and 24.04 and probed as a normal user, offline, using CLI/agent version/help and fail-closed read-only setup check. This does not verify GNOME/browser/notification behavior, a camera, PAM authentication, or any human biometric. Includes source, SHA256SUMS, build metadata and GitHub provenance. Verify checksums and provenance before installation; repository-enforced release immutability is not assumed. Installation never enrolls or activates face authentication, edits sudo/login PAM policies, or downloads/builds a runtime."
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
